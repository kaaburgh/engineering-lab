name: Build 1MiB JIT cache for local wrap-around test
on:
  push:
    branches: [bench/quake-p0-p1-local-builds]
    paths: [.github/workflows/quake-smallcache-local-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-pair:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 55
    steps:
      - name: Install compiler and dependencies
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build g++ gcc ccache pkg-config python3 \
            libasound2-dev libfluidsynth-dev libiir-dev libpng-dev libopusfile-dev \
            libspeexdsp-dev libsdl3-dev libsdl3-image-dev libasio-dev zlib1g-dev \
            libgl-dev nasm file
      - name: Checkout fork and record toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch experiments/quake-guest-block-mapping \
            https://github.com/kaaburgh/dosbox-staging.git /tmp/fork
          mkdir -p /tmp/out/bin /tmp/out/lib /tmp/out/probes /tmp/out/logs
          git -C /tmp/fork rev-parse HEAD > /tmp/out/FORK_SHA
          cat /etc/os-release > /tmp/out/OS_RELEASE
          (g++ --version; cmake --version; ninja --version) > /tmp/out/TOOLCHAIN
          dpkg-query -W > /tmp/out/DPKG_LOCK_MANIFEST
          # Debian 13 libiir-dev exports an absent unused static CMake target.
          multiarch="$(gcc -dumpmachine)"
          if [ ! -e "/usr/lib/$multiarch/libiir_static.a" ]; then
            ln -s libiir.so "/usr/lib/$multiarch/libiir_static.a"
          fi
          ccache -M 3G
          ccache -z
          # Debian 13 libraries lag 0.84-alpha. Only patch two unrelated
          # SDL keymapper / MIDI calls in temporary source, not CPU/JIT.
          python3 - <<'PY'
          from pathlib import Path
          edits = {
            '/tmp/fork/src/gui/mapper.cpp': (
              'SDL_SetDefaultTextureScaleMode(mapper.renderer, SDL_SCALEMODE_NEAREST);',
              '/* SDK shim: only unused keyboard mapper. */'),
            '/tmp/fork/src/midi/fluidsynth.cpp': (
              'fluid_synth_set_portamento_time_mode(fluid_synth.get(),\n\t                                     FLUID_PORTAMENTO_TIME_MODE_XG_GS);',
              '/* SDK shim: only MIDI, disabled for Quake. */')
          }
          for path,(old,new) in edits.items():
            p=Path(path)
            content=p.read_text()
            assert content.count(old)==1,(path,content.count(old))
            p.write_text(content.replace(old,new))
          PY
          # Stress-only source alteration: force real JIT cache wraparound.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/fork/src/cpu/core_dyn_x86.cpp')
          s=p.read_text()
          old=next(line for line in s.splitlines() if line.startswith('#define CACHE_TOTAL'))
          assert '(1024*1024*8)' in old, old
          p.write_text(s.replace(old,'#define CACHE_TOTAL (1024*1024*1)'))
          PY
          printf 'Experiment: temporary 1MiB JIT cache + Debian SDL/MIDI API shims; NOT a production build\n' > /tmp/out/LOCAL_SDK_SHIMS
          cd /tmp/fork/extras/guest-block-mapping
          python3 -m unittest discover -s . -p test_analyze_trace.py -v
          g++ -std=c++23 -O2 -Wall -Wextra -Werror test_jit_block_trace_io.cpp -o /tmp/jit-io-test
          /tmp/jit-io-test
          nasm -f bin smc_invalidations.asm -o /tmp/out/probes/SMC.COM
          nasm -f bin crosspage_invalidations.asm -o /tmp/out/probes/XPG.COM
          cc -O2 -shared -fPIC -o /tmp/out/probes/preload_sigprof_thread.so preload_sigprof_thread.c -ldl -pthread
      - name: Build one diagnostic 1MiB cache variant
        shell: bash
        run: |
          set -euo pipefail
          export CCACHE_DIR=/tmp/ccache
          cmake -S /tmp/fork -B /tmp/fork/build/smallcache -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DUSE_SYSTEM_LIBS=ON \
            -DOPT_MT32EMU=OFF -DOPT_TESTS=OFF -DOPT_DOCUMENTATION=OFF \
            -DOPT_JIT_BLOCK_TRACE=ON 2>&1 | tee /tmp/out/logs/cmake-smallcache.log
          cmake --build /tmp/fork/build/smallcache -j2 2>&1 | tee /tmp/out/logs/build-smallcache.log
          cp /tmp/fork/build/smallcache/dosbox /tmp/out/bin/dosbox-smallcache
      - name: Bundle runtime libs and manifest for local container
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, shutil, re
          dest=Path('/tmp/out/lib')
          libs={}
          for kind in ('smallcache',):
            f=Path('/tmp/out/bin/dosbox-'+kind)
            result=subprocess.check_output(['ldd',str(f)],text=True)
            for line in result.splitlines():
              m=re.search(r'^\s*(\S+)\s+=>\s+(/\S+)\s+\(',line)
              if m:
                name, path=m.group(1),Path(m.group(2))
                assert path.is_file(),line
                if name not in libs:
                  libs[name]=str(path)
                  shutil.copy2(path,dest/name,follow_symlinks=True)
            (Path('/tmp/out/logs')/('ldd-'+kind+'.log')).write_text(result)
          Path('/tmp/out/LIBRARIES_MANIFEST').write_text(
            ''.join(f'{name} {path}\n' for name,path in sorted(libs.items())))
          print('Copied',len(libs),'runtime libraries')
          PY
          ( cd /tmp/out && find bin lib probes -type f -print0 | sort -z | xargs -0 sha256sum ) \
            > /tmp/out/SHA256SUMS
          du -sh /tmp/out
      - name: Upload stress binary for LOCAL execution (no gameplay in CI)
        uses: actions/upload-artifact@v4
        with:
          name: dosbox-084-1mib-jit-cache-stress
          path: /tmp/out/
          retention-days: 10
          compression-level: 6
